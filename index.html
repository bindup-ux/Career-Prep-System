<!DOCTYPE html>
<html>
<head>
    <title>AI Career Prep System</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1abc9c, #2c3e50);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 10px;
            font-weight: 700;
            color: #2c3e50;
        }

        p {
            font-size: 14px;
            color: gray;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            width: 48%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #1abc9c;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background: #16a085;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Career Prep</h1>
    <p>Analyze your resume & prepare for interviews</p>

    <form method="POST">
        <input type="text" name="username" placeholder="Enter Username" required>
        <input type="password" name="password" placeholder="Enter Password" required>

        <div class="btn-group">
            <button formaction="/login">Login</button>
            <button formaction="/signup">Signup</button>
        </div>
    </form>

</div>

</body>
</html>
