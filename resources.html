<!DOCTYPE html>
<html>
<head>
    <title>Resources</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1abc9c);
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 6px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: #e8f8f5;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .card a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #1abc9c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .card a:hover {
            background: #16a085;
        }

        .tip {
            margin-top: 30px;
            padding: 15px;
            background: #ecf9f6;
            border-radius: 8px;
            text-align: center;
        }

        .tip b {
            color: #2c3e50;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📚 Learning Resources</h2>

    <div class="grid">

        <div class="card">
            <h3>🐍 Python</h3>
            <p>Beginner to advanced tutorials</p>
            <a href="https://www.w3schools.com/python/" target="_blank">W3Schools</a>
        </div>

        <div class="card">
            <h3>☕ Java</h3>
            <p>Concepts + interview preparation</p>
            <a href="https://www.geeksforgeeks.org/java/" target="_blank">GeeksforGeeks</a>
        </div>

        <div class="card">
            <h3>🗄 SQL</h3>
            <p>Database concepts & queries</p>
            <a href="https://www.tutorialspoint.com/sql/" target="_blank">TutorialsPoint</a>
        </div>

        <div class="card">
            <h3>💻 Practice</h3>
            <p>Improve coding skills</p>
            <a href="https://leetcode.com/" target="_blank">LeetCode</a>
        </div>

    </div>

    <div class="tip">
        💡 <b>Tip:</b> Practice daily on coding platforms to improve placement chances.
    </div>

</div>

</body>
</html>
