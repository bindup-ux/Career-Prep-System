<!DOCTYPE html>
<html>
<head>
    <title>Resume Analyzer</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1abc9c, #2c3e50);
        }

        .container {
            width: 450px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        p {
            color: gray;
            font-size: 14px;
        }

        input[type="file"] {
            margin-top: 20px;
            padding: 10px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #1abc9c;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background: #16a085;
        }

        .skills {
            margin-top: 20px;
            text-align: left;
        }

        .skill-box {
            display: inline-block;
            background: #ecf0f1;
            padding: 8px 12px;
            border-radius: 20px;
            margin: 5px;
            font-size: 14px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #1abc9c;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📄 Resume Analyzer</h1>
    <p>Upload your resume and discover your skills instantly</p>

    <form action="/analyze" method="POST" enctype="multipart/form-data">
        <input type="file" name="resume" required>
        <br>
        <button type="submit">Analyze Resume</button>
    </form>

    {% if skills %}
    <div class="skills">
        <h3>✅ Detected Skills:</h3>

        {% for skill in skills %}
            <span class="skill-box">{{ skill }}</span>
        {% endfor %}
    </div>
    {% endif %}

    <a href="/dashboard" class="back-btn">⬅ Back to Dashboard</a>

</div>

</body>
</html>
